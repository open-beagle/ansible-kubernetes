tcp:
  routers:
    apiserver:
      rule: "HostSNI(`*`)"
      service: "apiserver"
      entryPoints:
        - "apiserver"
    registry:
      rule: "HostSNI(`*`)"
      service: "registry"
      entryPoints:
        - "regsitry"
  services:
    apiserver:
      loadBalancer:
        servers:
{% for host in groups['master'] %}
          - address: "{{ hostvars[host]['HOST_IP'] }}:6443"
{% endfor %}
    registry:
      loadBalancer:
        servers:
{% for host in groups['master'] %}
          - address: "{{ hostvars[host]['HOST_IP'] }}:6444"
{% endfor %}
